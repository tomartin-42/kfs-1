# Arranca inmediatamente la primera entrada del menú.
set timeout=0
set default=0

# Para mostrar el menú durante cinco segundos, descomenta estas opciones
# y comenta la línea `set timeout=0` anterior.
# set timeout_style=menu
# set timeout=5

# Muestra mensajes internos de GRUB; es útil para diagnosticar el arranque.
# set debug=all

menuentry "KFS-1" {
    # Carga el kernel compatible con Multiboot 1.
    multiboot /boot/kernel.bin

    # Transfiere el control al kernel cargado.
    boot
}
